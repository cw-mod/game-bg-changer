<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatWar: смена фона в Игровой</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    margin: 0;
    background: #1a1a1a;
    color: #d9d9d9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: lowercase; color: #999; margin-bottom: 12px; }
  h1 { font-size: 24px; margin: 0 0 14px; color: #fff; font-weight: bold; }
  .lead { font-size: 13px; line-height: 1.7; color: #b3b3b3; margin: 0 0 26px; max-width: 480px; }
  .btn {
    display: inline-block; padding: 12px 26px; border-radius: 10px;
    background: #e8e8e8; color: #1a1a1a; font-weight: bold; font-size: 14px;
    text-decoration: none; font-family: inherit;
  }
  .btn:hover { background: #fff; }
</style>
</head>
<body>
<div>
  <div class="eyebrow">userscript</div>
  <h1>смена фона в игровой</h1>
  <p class="lead">нажмите на кнопку в правом нижнем углу, вставьте ссылку на нужную картинку и фон cw3 заменится на неё</p>
  <a class="btn" href="catwar-game-bg.user.js">установить</a>
</div>
</body>
</html>
