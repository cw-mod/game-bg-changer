<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatWar: смена фона в Игровой</title>
<style>
  :root {
    --bg: #12151c;
    --border: rgba(255, 255, 255, .08);
    --gold: #d4a954;
    --gold-bright: #f0c674;
    --text: #d9dde3;
    --muted: #8b93a1;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Verdana, Arial, sans-serif;
    margin: 0;
    background:
      radial-gradient(900px 420px at 15% -10%, rgba(212, 169, 84, .10), transparent 60%),
      radial-gradient(700px 380px at 110% 15%, rgba(90, 140, 255, .08), transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 56px 20px 64px; }

  .eyebrow {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 10px;
  }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 14px; color: #fff; font-weight: bold; }
  .lead { font-size: 14px; line-height: 1.6; color: var(--muted); margin: 0 0 28px; max-width: 560px; }

  .btn {
    display: inline-block; padding: 13px 30px; border-radius: 12px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #22180a; font-weight: bold; font-size: 15px;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(212, 169, 84, .25);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 9px 24px rgba(212, 169, 84, .35); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Userscript</div>
  <h1>Смена фона в Игровой</h1>
  <p class="lead">Нажмите на кнопку в правом нижнем углу, вставьте ссылку на нужную
     картинку и фон CW3 заменится на неё.</p>
  <a class="btn" href="catwar-game-bg.user.js">Установить</a>
</div>
</body>
</html>
